packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  msgpackr-extract: false
  unrs-resolver: false
  sharp: false
  '@scarf/scarf': false
  # CPU binaries are bundled; the script only downloads optional CUDA files.
  onnxruntime-node: false
  protobufjs: false
# Next.js 16.4.4 is a security release newer than pnpm's minimum release age; allowed on purpose (see ASSUMPTIONS.md).
minimumReleaseAgeExclude:
  - '@next/env@16.4.4'
  - '@next/eslint-plugin-next@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - eslint-config-next@16.4.4
  - next@16.4.4
overrides:
  'minimatch@<11.0.1': ^11.0.4
